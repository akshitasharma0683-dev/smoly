<html>
<header>
    <title>register</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/hero.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">    <script th:src="@{/js/script.js}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    
</header>



<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>




<!-- Contact Section -->
<section id="contact" class="content-section">
    <h2 class="section-title">Get Start</h2>
    <p class="section-subtitle">
        Welcome to Smoly an smole initiative to make your life easy
    </p>

    <div class="contact-form">
        <form>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Enter your first name" required>
                </div>
                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Enter your last name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">password</label>
<input type="password" id="password" class="form-input" placeholder="Enter your password" required>            </div>


           <button type="button" class="submit-btn" onclick="registerUser()">
    <span>Register</span>
</button>
        </form>
    </div>
</section>
</div>


<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
