<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>login</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/hero.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">    <script th:src="@{/js/script.js}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <style>

        .hero {
            text-align: center;
            margin-top: 120px;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 700;
            background: linear-gradient(90deg, #4ecdc4, #3e8996);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            margin-top: 15px;
            font-size: 18px;
            opacity: 0.75;
        }

        .hero-buttons {
            margin-top: 30px;
        }

        .hero-btn {
            padding: 12px 25px;
            border-radius: 25px;
            margin: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .hero-btn.primary {
            background: #3e8996;
            color: white;
        }

        .hero-btn.secondary {
            border: 1px solid #3e8996;
            color: #3e8996;
        }

        .hero-btn:hover {
            transform: scale(1.05);
        }

        .feature-strip {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px auto;
            opacity: 0.8;
        }

        .feature-strip div {
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .cta-section {
            text-align: center;
            margin: 80px 0;
        }

        .cta-section h2 {
            font-size: 30px;
        }

        .cta-section p {
            opacity: 0.7;
            margin: 10px 0 20px;
        }

    </style>
</head>



<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>


<section id="contact" class="content-section">

    <section class="hero">
        <h1>Build. Shorten. Create.</h1>
        <p>Smoly helps you simplify links and generate certificates instantly — all in one place.</p>

        ```
        <div class="hero-buttons">
            <a href="@{/smolyLink}" class="hero-btn primary">Try Link Shortener</a>
            <a href="@{/certificate}" class="hero-btn secondary">Create Certificate</a>
        </div>
        ```

    </section>

    <section class="feature-strip">
        <div> Fast & Lightweight</div>
        <div> Smart URL Redirection</div>
        <div> Instant Certificate Generation</div>
        <div> Click Tracking</div>
    </section>
</section>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
