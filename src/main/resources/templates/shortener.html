<html>
<header>
    <title>smolyLink</title>
  
    <link rel="stylesheet" th:href="@{/css/shorten.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/hero.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">    <script th:src="@{/js/script.js}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    
</header>



<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- MAIN CONTENT -->
<section id="contact"  class="content-section">
<div  class="shortener-page">
    <!-- Page Header -->
    <div class="page-header">
        <h1>Shorten Your Links</h1>
        <p>Create short, secure and shareable URLs in seconds.</p>
    </div>

    <!-- Top Grid -->
    <div class="shortener-grid">

        <!-- LEFT CARD -->
        <div class="card create-card">

            <div class="card-header">
                <h2>Create Short Link</h2>
            </div>

            <form id="shortenForm">

                <div class="form-group">
                    <label>Long URL</label>
                    <input
                            type="url"
                            id="urlInput"
                            placeholder="Paste your long URL here..."
                            required>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Custom Alias (Optional)</label>
                        <input
                                type="text"
                                id="alias"
                                placeholder="custom-alias">
                    </div>

                    <div class="form-group">
                        <label>Expiry (Optional)</label>
                        <input
                                type="date"
                                id="expiryDate">
                    </div>

                </div>
<!--
                <div class="checkbox-group">
                    <input type="checkbox" id="generateQr">
                    <label for="generateQr">Generate QR Code</label>
                </div>
-->
                <button
                        type="button"
                        id="btn"
                        class="primary-btn"
                        onclick="shorten()">

                    Shorten Link

                </button>

            </form>

        </div>

        <!-- RIGHT CARD -->

        <div class="card result-card">

            <div class="card-header">
                <h2>Your Short Link</h2>
            </div>

            <div id="resultContainer">

                <div class="empty-state">

                    

                    <H3>
                        Create your first short link to see the
                        result here.
                    </H3>

                </div>

                <!--
                Replace this with JS after shortening
                -->

                <div
                        id="result"
                        class="generated-result"
                        style="display:none;">

                    <div class="short-url-box">

                        <a
                                id="shortLink"
                                href="#"
                                target="_blank">
                        </a>

                        <div class="action-buttons">

                            <button id="copyBtn">
                                Copy
                            </button>

                            <button id="openBtn">
                                Open
                            </button>

                        </div>

                    </div>

                    <div class="result-info">

                        <div class="info-item">
                            <span>Clicks</span>
                            <strong id="clickCount">0</strong>
                        </div>

                        <div class="info-item">
                            <span>Created</span>
                            <strong id="createdDate">Today</strong>
                        </div>

                        <div class="info-item">
                            <span>Expiry</span>
                            <strong id="expiryText">Never</strong>
                        </div>

                    </div>

                    <div class="qr-container">

                        <img
                                id="qrImage"
                                src=""
                                alt="QR Code">

                    </div>

                </div>

            </div>

        </div>

    </div>

   

</section>
</div>
</section>


<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
