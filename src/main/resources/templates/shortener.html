<html>
<header>
    <title>smolyLink</title>
    <style>




        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .box {
            background: #1e293b;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #0f172a;
            color: white;
            font-size: 14px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #020617;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .copy {
            margin-top: 10px;
            background: #22c55e;
        }

        footer {
            margin-top: 60px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            input {
                width: 100%;
            }
        }
    </style>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/hero.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">    <script th:src="@{/js/script.js}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    
</header>



<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>




<!-- Contact Section -->
<section id="contact" class="content-section">
    <h2 class="section-title">Smoly</h2>
    <p class="section-subtitle">
        Shorten your links instantly
    </p>

    <div class="box">
        <input type="text" id="urlInput" placeholder="Paste your long URL here...">
        <button id="btn" onclick="shorten()">Shorten</button>
    </div>

    <div id="result" class="result"></div>
    </div>
</section>
</div>


<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
